http:
    routers:
        cpad-frontend-router:
            rule: "Host(`cpad.localhost`)"
            service: cpad-frontend
            entryPoints:
                - websecure
            tls: true
        app-vps-docker-demo-router:
            rule: "Host(`app.vps-docker-demo.localhost`)"
            service: app-vps-docker-demo
            entryPoints:
                - websecure
            tls: true
        # /api/* goes to the tools API container instead: its Docker-label
        # router has a higher priority than this one.
        tools-frontend-router:
            rule: "Host(`tools.localhost`)"
            service: tools-frontend
            entryPoints:
                - websecure
            tls: true
        portal-router:
            rule: "Host(`portal.localhost`)"
            service: portal
            entryPoints:
                - websecure
            tls: true
    services:
        cpad-frontend:
            loadBalancer:
                servers:
                    - url: "http://host.docker.internal:3000"
        app-vps-docker-demo:
            loadBalancer:
                servers:
                    - url: "http://host.docker.internal:3000"
        tools-frontend:
            loadBalancer:
                servers:
                    - url: "http://host.docker.internal:3001"
        portal:
            loadBalancer:
                servers:
                    - url: "http://host.docker.internal:3000"
