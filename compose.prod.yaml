# Production overrides. On the server, symlink this to compose.override.yaml:
#
#   ln -s compose.prod.yaml compose.override.yaml
#
# Certificates come from Let's Encrypt (the "le" resolver below), and the
# dashboard is served on websecure behind basic auth (dynamic/prod/dashboard.yml).

services:
    jedi-proxy:
        # Clears the base file's guard profile — see compose.yaml.
        profiles: !reset []

        environment:
            - TRAEFIK_DASHBOARD_PWD_HASH=${TRAEFIK_DASHBOARD_PWD_HASH}
            - TRAEFIK_DASHBOARD_DOMAIN=${TRAEFIK_DASHBOARD_DOMAIN}

        command:
            - "--api.dashboard=true"

            # Watch Docker containers for Traefik labels and configure routes / services accordingly
            - "--providers.docker=true"

            # Don't expose Docker containers by default. Instead, require containers to opt in
            # via the `traefik.enable=true` label
            - "--providers.docker.exposedbydefault=false"

            # Accept incoming traffic on ports 80 (HTTP) & 443 (HTTPS)
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"

            # Redirect HTTP to HTTPs
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

            # Define an ACME resolver named "le"
            - "--certificatesresolvers.le.acme.email=sajad@hey.com"

            # The location to store private keys, certificates and renewal info for the "le" ACME resolver
            # This file must exist and have the permission 600 (owner=read+write)
            - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"

            # Enables the HTTP-01 ACME challenge so that Let's Encrypt can verify you own the domain
            # by calling your domain at http://<your-domain>/.well-known/.
            # This requires port 80 to be publicly open.
            - "--certificatesresolvers.le.acme.httpchallenge=true"
            - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"

            # Load configuration from YAML files in the /etc/traefik/dynamic/prod folder
            - "--providers.file.directory=/etc/traefik/dynamic/prod"

            # Reload Traefik when the YAML files from /etc/traefik/dynamic/prod are edited
            - "--providers.file.watch=true"

        # No 8080 here, unlike dev: prod does not enable --api.insecure, so nothing
        # listens on it. The base file's 80 and 443 are all prod publishes.

        volumes:
            # Contains your dynamic Traefik configuration
            - ./dynamic:/etc/traefik/dynamic

            # Stores ACME data (acme.json) in production
            - ./letsencrypt:/letsencrypt
