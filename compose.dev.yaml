# Local development overrides. On the laptop, symlink this to
# compose.override.yaml:
#
#   ln -s compose.dev.yaml compose.override.yaml
#
# Certificates come from mkcert (./bin/mkcert), and the dashboard is served
# without authentication on http://localhost:8080.

services:
    jedi-proxy:
        # Clears the base file's guard profile — see compose.yaml.
        profiles: !reset []

        command:
            # Enable the dashboard and API routes on port 8080
            - "--api.insecure=true"

            # Watch Docker containers for Traefik labels and configure routes / services accordingly
            - "--providers.docker=true"

            # Don't expose Docker containers by default. Instead, require containers to opt in
            # via the `traefik.enable=true` label
            - "--providers.docker.exposedbydefault=false"

            # Accept incoming traffic on ports 80 (HTTP) & 443 (HTTPS)
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"

            # Redirect HTTP to HTTPs
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

            # Load configuration from YAML files in the /etc/traefik/dynamic/dev folder
            # We'll add info here about local SSL certificates generated via mkcert
            - "--providers.file.directory=/etc/traefik/dynamic/dev"

            # Reload Traefik when the YAML files from /etc/traefik/dynamic/dev are edited
            - "--providers.file.watch=true"
        ports:
            # The unauthenticated dashboard (--api.insecure above). Dev only.
            - "8080:8080"
        volumes:
            # SSL certificates generated by mkcert will be stored here
            - ./certs:/certs

            # Contains our dynamic Traefik configuration. This directory is
            # specified as a file provider in the --providers.file.directory
            # flag. You can find that flat services.proxy.command above.
            - ./dynamic/dev:/etc/traefik/dynamic/dev
